<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | TaskLocal</title>

    <link rel="icon" type="image/png" href="logo.png">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="login.css">

    <script src="https://unpkg.com/lucide@latest"></script>

</head>

<body>

    <div class="background-animation">

        <div class="floating-image image-one">
            <img
                src="https://images.unsplash.com/photo-1581578731548-c64695cc6952?auto=format&fit=crop&w=700&q=85"
                alt="Home maintenance service">
        </div>

        <div class="floating-image image-two">
            <img
                src="https://images.unsplash.com/photo-1621905251189-08b45d6a269e?auto=format&fit=crop&w=700&q=85"
                alt="Electrical service">
        </div>

        <div class="floating-image image-three">
            <img
                src="https://images.unsplash.com/photo-1558618666-fcd25c85cd64?auto=format&fit=crop&w=700&q=85"
                alt="Home repair service">
        </div>

        <div class="floating-image image-four">
            <img
                src="https://images.unsplash.com/photo-1527515637462-cff94eecc1ac?auto=format&fit=crop&w=700&q=85"
                alt="Cleaning service">
        </div>

        <div class="floating-image image-five">
            <img
                src="https://images.unsplash.com/photo-1581783898377-1c85bf937427?auto=format&fit=crop&w=700&q=85"
                alt="Handyman tools">
        </div>

        <div class="service-orb orb-one"></div>
        <div class="service-orb orb-two"></div>
        <div class="service-orb orb-three"></div>

    </div>


    <div class="page-overlay"></div>


    <div class="top-controls">

        <button
            id="rtlToggle"
            class="rtl-btn"
            type="button"
            aria-label="Toggle text direction">
            RTL
        </button>

        <button
            id="themeToggle"
            class="theme-btn"
            type="button"
            aria-label="Toggle dark mode">
            <i data-lucide="moon"></i>
        </button>

    </div>


    <main class="login-page">

        <section class="login-card">

            <div class="login-logo">

                <a href="index.html">

                    <img
                        src="logo.jpeg"
                        alt="TaskLocal Logo">

                    <span class="logo-text">
                        Task<span>Local</span>
                    </span>

                </a>

            </div>


            <div class="login-header">

                <span class="login-label">
                    WELCOME BACK
                </span>

                <h1>
                    Sign in to TaskLocal
                </h1>

                <p>
                    Manage your tasks, connect with local pros,
                    and keep everything in one place.
                </p>

            </div>


            <div class="social-login">

                <a
                    href="https://accounts.google.com/"
                    class="social-btn"
                    target="_blank"
                    rel="noopener noreferrer">

                    <i class="fa-brands fa-google google-icon"></i>

                    <span>
                         Google
                    </span>

                </a>


                <a
                    href="https://appleid.apple.com/"
                    class="social-btn"
                    target="_blank"
                    rel="noopener noreferrer">

                    <i class="fa-brands fa-apple apple-icon"></i>

                    <span>
                       Apple
                    </span>

                </a>

            </div>


            <div class="divider">
                <span>OR CONTINUE WITH EMAIL</span>
            </div>


            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <div class="input-wrapper">

                        <i
                            data-lucide="mail"
                            class="input-icon">
                        </i>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email address"
                            autocomplete="email"
                            required>

                    </div>

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="input-wrapper">

                        <i
                            data-lucide="lock-keyhole"
                            class="input-icon">
                        </i>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required>

                        <button
                            type="button"
                            class="password-toggle"
                            id="passwordToggle"
                            aria-label="Show password">

                            <i data-lucide="eye"></i>

                        </button>

                    </div>

                </div>


                <div class="form-options">

                    <label class="remember-option">

                        <input
                            type="checkbox"
                            id="rememberMe">

                        <span class="custom-checkbox"></span>

                        <span>
                            Remember Me
                        </span>

                    </label>


                    <a
                        href="forgot-password.html"
                        class="forgot-link">

                        Forgot Password?

                    </a>

                </div>


                <button
                    type="submit"
                    class="login-btn">

                    <span>
                        Sign In
                    </span>

                    <i data-lucide="arrow-right"></i>

                </button>

            </form>


            <div class="signup-text">

                <span>
                    Don't have an account?
                </span>

                <a href="signup.html">
                    Create an account
                </a>

            </div>


            

        </section>

    </main>


    <script>

        document.addEventListener("DOMContentLoaded", function () {

            lucide.createIcons();


            const body = document.body;

            const themeToggle =
                document.getElementById("themeToggle");

            const rtlToggle =
                document.getElementById("rtlToggle");

            const passwordToggle =
                document.getElementById("passwordToggle");

            const passwordInput =
                document.getElementById("password");

            const loginForm =
                document.getElementById("loginForm");


            const savedTheme =
                localStorage.getItem("tasklocal-theme");


            if (savedTheme === "dark") {

                body.classList.add("dark");

            }


            function updateThemeIcon() {

                themeToggle.innerHTML =
                    body.classList.contains("dark")
                    ? '<i data-lucide="sun"></i>'
                    : '<i data-lucide="moon"></i>';

                lucide.createIcons();

            }


            updateThemeIcon();


            const savedDirection =
                localStorage.getItem("tasklocal-direction");


            if (savedDirection === "rtl") {

                document.documentElement.setAttribute(
                    "dir",
                    "rtl"
                );

                rtlToggle.textContent = "LTR";

            }


            themeToggle.addEventListener(
                "click",
                function () {

                    body.classList.toggle("dark");

                    localStorage.setItem(
                        "tasklocal-theme",
                        body.classList.contains("dark")
                            ? "dark"
                            : "light"
                    );

                    updateThemeIcon();

                }
            );


            rtlToggle.addEventListener(
                "click",
                function () {

                    const isRTL =
                        document.documentElement
                        .getAttribute("dir") === "rtl";


                    if (isRTL) {

                        document.documentElement
                            .setAttribute("dir", "ltr");

                        rtlToggle.textContent = "RTL";

                        localStorage.setItem(
                            "tasklocal-direction",
                            "ltr"
                        );

                    } else {

                        document.documentElement
                            .setAttribute("dir", "rtl");

                        rtlToggle.textContent = "LTR";

                        localStorage.setItem(
                            "tasklocal-direction",
                            "rtl"
                        );

                    }

                }
            );


            passwordToggle.addEventListener(
                "click",
                function () {

                    const isPassword =
                        passwordInput.type === "password";


                    passwordInput.type =
                        isPassword
                            ? "text"
                            : "password";


                    passwordToggle.innerHTML =
                        isPassword
                        ? '<i data-lucide="eye-off"></i>'
                        : '<i data-lucide="eye"></i>';


                    passwordToggle.setAttribute(
                        "aria-label",
                        isPassword
                            ? "Hide password"
                            : "Show password"
                    );


                    lucide.createIcons();

                }
            );


            loginForm.addEventListener(
                "submit",
                function (event) {

                    event.preventDefault();

                    const email =
                        document
                        .getElementById("email")
                        .value
                        .trim();

                    const password =
                        passwordInput
                        .value
                        .trim();


                    if (!email || !password) {

                        return;

                    }


                    window.location.href =
                        "dashboard.html";

                }
            );

        });

    </script>

</body>

</html>
