<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Page Not Found | TaskLocal</title>

    <link rel="icon" type="image/png" href="logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <script src="https://unpkg.com/lucide@latest"></script>

    <style>

        :root {
            --primary: #FF7A5C;
            --primary-dark: #EA580C;

            --secondary: #0F4D4A;
            --secondary-dark: #083B39;

            --bg-color: #F8FAFC;
            --text-color: #1E293B;

            --card-bg: #FFFFFF;
            --border-color: #E2E8F0;

            --primary-light: rgba(249, 115, 22, 0.12);
            --secondary-light: rgba(15, 77, 74, 0.10);

            --heading-color: #083B39;
            --text-light: #64748B;
        }

        body.dark {
            --bg-color: #071C1B;
            --text-color: #E8F3F2;

            --card-bg: #0D2927;
            --border-color: #24504D;

            --primary: #FB923C;
            --primary-dark: #F97316;

            --secondary: #5EEAD4;
            --secondary-dark: #2DD4BF;

            --primary-light: rgba(251, 146, 60, 0.18);
            --secondary-light: rgba(94, 234, 212, 0.12);

            --heading-color: #F0FDFA;
            --text-light: #94A3B8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            background: var(--bg-color);
            color: var(--text-color);
            font-family: "Inter", "Segoe UI", Arial, sans-serif;
            transition:
                background 0.35s ease,
                color 0.35s ease;
        }

        button,
        a {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .background-animation {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        .page-overlay {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;

            background:
                linear-gradient(
                    135deg,
                    rgba(248, 250, 252, 0.80),
                    rgba(248, 250, 252, 0.58)
                );
        }

        body.dark .page-overlay {
            background:
                linear-gradient(
                    135deg,
                    rgba(7, 28, 27, 0.82),
                    rgba(7, 28, 27, 0.62)
                );
        }

        .floating-shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(2px);
            animation: shapeFloat 9s ease-in-out infinite;
        }

        .shape-one {
            width: 220px;
            height: 220px;
            top: -70px;
            left: 25%;
            background: rgba(255, 122, 92, 0.13);
        }

        .shape-two {
            width: 300px;
            height: 300px;
            right: 12%;
            bottom: -130px;
            background: rgba(15, 77, 74, 0.11);
            animation-delay: -3s;
        }

        .shape-three {
            width: 150px;
            height: 150px;
            left: 5%;
            bottom: 15%;
            background: rgba(255, 122, 92, 0.09);
            animation-delay: -6s;
        }

        body.dark .shape-one {
            background: rgba(251, 146, 60, 0.13);
        }

        body.dark .shape-two {
            background: rgba(94, 234, 212, 0.10);
        }

        body.dark .shape-three {
            background: rgba(251, 146, 60, 0.10);
        }

        .floating-image {
            position: absolute;
            width: 150px;
            height: 105px;
            overflow: hidden;

            border: 5px solid rgba(255, 255, 255, 0.78);
            border-radius: 18px;

            box-shadow:
                0 18px 45px rgba(15, 23, 42, 0.16);

            opacity: 0.65;

            animation:
                imageFloat 8s ease-in-out infinite;
        }

        body.dark .floating-image {
            border-color: rgba(94, 234, 212, 0.20);

            box-shadow:
                0 18px 45px rgba(0, 0, 0, 0.42);

            opacity: 0.48;
        }

        .floating-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .image-one {
            top: 10%;
            left: 7%;
        }

        .image-two {
            top: 15%;
            right: 7%;
            animation-delay: -2s;
        }

        .image-three {
            bottom: 9%;
            left: 8%;
            animation-delay: -4s;
        }

        .top-controls {
            position: fixed;
            top: 20px;
            right: 22px;

            z-index: 20;

            display: flex;
            align-items: center;
            gap: 8px;
        }

        .rtl-btn,
        .theme-btn {
            height: 40px;

            border: 1px solid var(--secondary);
            border-radius: 9px;

            background: rgba(255, 255, 255, 0.86);
            color: var(--text-color);

            backdrop-filter: blur(10px);

            transition:
                border-color 0.25s ease,
                color 0.25s ease,
                background 0.25s ease;
        }

        body.dark .rtl-btn,
        body.dark .theme-btn {
            background: rgba(13, 41, 39, 0.90);
        }

        .rtl-btn {
            min-width: 46px;
            padding: 0 10px;

            font-size: 11px;
            font-weight: 800;
        }

        .theme-btn {
            width: 40px;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .theme-btn i {
            width: 17px;
            height: 17px;
        }

        .rtl-btn:hover,
        .theme-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        [dir="rtl"] .top-controls {
            right: auto;
            left: 22px;
        }

        .error-page {
            position: relative;
            z-index: 5;

            width: 100%;
            min-height: 100vh;

            padding: 35px 25px;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .error-card {
            width: min(100%, 620px);

            padding: 32px 42px;

            border: 1px solid var(--border-color);
            border-radius: 24px;

            background: rgba(255, 255, 255, 0.94);

            box-shadow:
                0 25px 70px rgba(15, 23, 42, 0.14);

            backdrop-filter: blur(18px);

            text-align: center;
        }

        body.dark .error-card {
            background: rgba(13, 41, 39, 0.95);

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.40);
        }

        .error-logo {
            margin-bottom: 15px;
        }

        .error-logo a {
            display: inline-flex;
            align-items: center;
            gap: 7px;
        }

        .error-logo img {
            width: 48px;
            height: 48px;
            object-fit: contain;
        }

        .logo-text {
            color: var(--primary);

            font-size: 23px;
            font-weight: 800;
        }

        .logo-text span {
            color: var(--secondary);
        }

        .error-illustration {
            display: flex;
            align-items: center;
            justify-content: center;

            gap: 15px;

            margin: 5px 0 12px;
        }

        .error-number {
            color: var(--heading-color);

            font-size: 105px;
            font-weight: 800;

            line-height: 0.9;

            letter-spacing: -7px;
        }

        .tool-circle {
            width: 88px;
            height: 88px;

            flex: 0 0 88px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    var(--primary-dark)
                );

            color: #ffffff;

            box-shadow:
                0 15px 35px rgba(234, 88, 12, 0.25);

            animation: toolFloat 3s ease-in-out infinite;
        }

        .tool-circle i {
            width: 43px;
            height: 43px;

            transform: rotate(-35deg);
        }

        .error-content {
            max-width: 500px;
            margin: 0 auto;
        }

        .error-label {
            display: inline-block;

            margin-bottom: 7px;

            color: var(--primary);

            font-size: 11px;
            font-weight: 800;

            letter-spacing: 1.7px;
        }

        .error-content h1 {
            margin-bottom: 10px;

            color: var(--heading-color);

            font-size: 28px;
            font-weight: 800;

            line-height: 1.25;
        }

        .error-content p {
            color: var(--text-light);

            font-size: 14px;
            line-height: 1.7;
        }

        .error-actions {
            margin-top: 24px;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 10px;
        }

        .primary-btn,
        .secondary-btn {
            min-height: 44px;

            padding: 10px 19px;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            gap: 8px;

            border-radius: 9px;

            font-size: 13px;
            font-weight: 800;

            transition:
                background 0.25s ease,
                border-color 0.25s ease,
                color 0.25s ease,
                transform 0.25s ease;
        }

        .primary-btn {
            border: 1px solid var(--primary);
            background: var(--primary);
            color: #ffffff;
        }

        .primary-btn:hover {
            background: var(--primary-dark);
            border-color: var(--primary-dark);
            transform: translateY(-2px);
        }

        .secondary-btn {
            border: 1px solid var(--secondary);
            background: transparent;
            color: var(--secondary);
        }

        .secondary-btn:hover {
            background: var(--secondary);
            color: #ffffff;
            transform: translateY(-2px);
        }

        .primary-btn i,
        .secondary-btn i {
            width: 16px;
            height: 16px;
        }

        .error-help {
            margin-top: 23px;
            padding-top: 18px;

            border-top: 1px solid var(--border-color);

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 11px;

            text-align: left;
        }

        .help-icon {
            width: 38px;
            height: 38px;

            flex: 0 0 38px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 9px;

            background: var(--primary-light);
            color: var(--primary);
        }

        .help-icon i {
            width: 18px;
            height: 18px;
        }

        .error-help div:last-child {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .error-help strong {
            color: var(--heading-color);
            font-size: 12px;
        }

        .error-help span {
            color: var(--text-light);
            font-size: 11px;
            line-height: 1.5;
        }

        [dir="rtl"] .error-help {
            text-align: right;
        }

        [dir="rtl"] .primary-btn i {
            transform: rotate(180deg);
        }

        @keyframes imageFloat {
            0%,
            100% {
                transform:
                    translate3d(0, 0, 0)
                    rotate(-2deg);
            }

            50% {
                transform:
                    translate3d(0, -15px, 0)
                    rotate(2deg);
            }
        }

        @keyframes shapeFloat {
            0%,
            100% {
                transform:
                    translate(0, 0)
                    scale(1);
            }

            50% {
                transform:
                    translate(25px, -20px)
                    scale(1.08);
            }
        }

        @keyframes toolFloat {
            0%,
            100% {
                transform: translateY(0) rotate(0deg);
            }

            50% {
                transform: translateY(-7px) rotate(4deg);
            }
        }

        @media (max-width: 1024px) {

            .error-card {
                width: min(100%, 590px);
                padding: 30px 38px;
            }

            .error-number {
                font-size: 95px;
            }

            .tool-circle {
                width: 82px;
                height: 82px;
                flex-basis: 82px;
            }

            .error-content h1 {
                font-size: 26px;
            }

            .floating-image {
                width: 125px;
                height: 90px;
                opacity: 0.42;
            }
        }

        @media (max-width: 768px) {

            body {
                overflow: hidden;
            }

            .top-controls {
                top: 14px;
                right: 15px;
                gap: 7px;
            }

            [dir="rtl"] .top-controls {
                left: 15px;
                right: auto;
            }

            .rtl-btn,
            .theme-btn {
                height: 37px;
            }

            .rtl-btn {
                min-width: 43px;
                font-size: 10px;
            }

            .theme-btn {
                width: 37px;
            }

            .error-page {
                padding: 70px 18px 25px;
            }

            .error-card {
                width: min(100%, 500px);
                padding: 28px 25px;
                border-radius: 20px;
            }

            .error-logo {
                margin-bottom: 13px;
            }

            .error-logo img {
                width: 43px;
                height: 43px;
            }

            .logo-text {
                font-size: 21px;
            }

            .error-illustration {
                gap: 10px;
                margin-bottom: 15px;
            }

            .error-number {
                font-size: 82px;
                letter-spacing: -5px;
            }

            .tool-circle {
                width: 70px;
                height: 70px;
                flex-basis: 70px;
            }

            .tool-circle i {
                width: 34px;
                height: 34px;
            }

            .error-label {
                font-size: 10px;
            }

            .error-content h1 {
                font-size: 23px;
            }

            .error-content p {
                font-size: 13px;
                line-height: 1.6;
            }

            .error-actions {
                margin-top: 21px;
            }

            .primary-btn,
            .secondary-btn {
                min-height: 42px;
                padding: 9px 15px;
                font-size: 12px;
            }

            .error-help {
                margin-top: 20px;
                padding-top: 15px;
            }

            .floating-image {
                width: 100px;
                height: 72px;
                border-width: 3px;
                border-radius: 12px;
                opacity: 0.25;
            }

            .image-one {
                left: -8px;
                top: 10%;
            }

            .image-two {
                right: -8px;
                top: 12%;
            }

            .image-three {
                left: -8px;
                bottom: 7%;
            }
        }

        @media (max-width: 360px) {

            body {
                overflow: hidden;
            }

            .top-controls {
                top: 9px;
                right: 9px;
                gap: 5px;
            }

            [dir="rtl"] .top-controls {
                left: 9px;
                right: auto;
            }

            .rtl-btn,
            .theme-btn {
                height: 32px;
            }

            .rtl-btn {
                min-width: 38px;
                padding: 0 7px;
                font-size: 9px;
            }

            .theme-btn {
                width: 32px;
            }

            .theme-btn i {
                width: 14px;
                height: 14px;
            }

            .error-page {
                min-height: 100vh;
                padding: 52px 10px 12px;
            }

            .error-card {
                width: 100%;
                max-width: 340px;

                padding: 21px 15px;

                border-radius: 16px;
            }

            .error-logo {
                margin-bottom: 9px;
            }

            .error-logo a {
                gap: 5px;
            }

            .error-logo img {
                width: 35px;
                height: 35px;
            }

            .logo-text {
                font-size: 18px;
            }

            .error-illustration {
                gap: 6px;
                margin: 4px 0 10px;
            }

            .error-number {
                font-size: 62px;
                letter-spacing: -4px;
            }

            .tool-circle {
                width: 53px;
                height: 53px;
                flex-basis: 53px;
            }

            .tool-circle i {
                width: 27px;
                height: 27px;
            }

            .error-label {
                margin-bottom: 5px;
                font-size: 8px;
                letter-spacing: 1.1px;
            }

            .error-content h1 {
                margin-bottom: 7px;
                font-size: 18px;
                line-height: 1.25;
            }

            .error-content p {
                font-size: 10px;
                line-height: 1.5;
            }

            .error-actions {
                margin-top: 16px;
                gap: 7px;
            }

            .primary-btn,
            .secondary-btn {
                min-height: 36px;
                padding: 7px 10px;
                gap: 5px;
                border-radius: 7px;
                font-size: 9px;
            }

            .primary-btn i,
            .secondary-btn i {
                width: 13px;
                height: 13px;
            }

            .error-help {
                margin-top: 15px;
                padding-top: 11px;
                gap: 7px;
            }

            .help-icon {
                width: 30px;
                height: 30px;
                flex-basis: 30px;
                border-radius: 7px;
            }

            .help-icon i {
                width: 14px;
                height: 14px;
            }

            .error-help div:last-child {
                gap: 2px;
            }

            .error-help strong {
                font-size: 9px;
            }

            .error-help span {
                font-size: 8px;
                line-height: 1.4;
            }

            .floating-image {
                width: 72px;
                height: 52px;
                border-width: 2px;
                border-radius: 8px;
                opacity: 0.18;
            }

            .image-one {
                left: -20px;
                top: 12%;
            }

            .image-two {
                right: -20px;
                top: 15%;
            }

            .image-three {
                left: -20px;
                bottom: 8%;
            }

            .shape-one {
                width: 110px;
                height: 110px;
            }

            .shape-two {
                width: 140px;
                height: 140px;
            }

            .shape-three {
                width: 75px;
                height: 75px;
            }
        }

    </style>
</head>

<body>

    <div class="background-animation">

        <div class="floating-shape shape-one"></div>
        <div class="floating-shape shape-two"></div>
        <div class="floating-shape shape-three"></div>

        <div class="floating-image image-one">
            <img
                src="https://images.unsplash.com/photo-1581578731548-c64695cc6952?auto=format&fit=crop&w=700&q=85"
                alt="Home repair service"
            >
        </div>

        <div class="floating-image image-two">
            <img
                src="https://images.unsplash.com/photo-1621905252507-b35492cc74b4?auto=format&fit=crop&w=700&q=85"
                alt="Handyperson working"
            >
        </div>

        <div class="floating-image image-three">
            <img
                src="https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?auto=format&fit=crop&w=700&q=85"
                alt="Home service"
            >
        </div>

    </div>

    <div class="page-overlay"></div>

    <div class="top-controls">

        <button
            id="rtlToggle"
            class="rtl-btn"
            type="button"
            aria-label="Toggle text direction"
        >
            RTL
        </button>

        <button
            id="themeToggle"
            class="theme-btn"
            type="button"
            aria-label="Toggle dark mode"
        >
            <i data-lucide="moon"></i>
        </button>

    </div>

    <main class="error-page">

        <section class="error-card">

            <div class="error-logo">

                <a href="index.html">

                    <img
                        src="logo.jpeg"
                        alt="TaskLocal - Local Handyperson & Home Task Marketplace"
                    >

                    <span class="logo-text">
                        Task<span>Local</span>
                    </span>

                </a>

            </div>

            <div class="error-illustration">

                <div class="error-number">4</div>

                <div class="tool-circle">
                    <i data-lucide="wrench"></i>
                </div>

                <div class="error-number">4</div>

            </div>

            <div class="error-content">

                <span class="error-label">
                    PAGE NOT FOUND
                </span>

                <h1>
                    Looks like this task
                    took a wrong turn.
                </h1>

                <p>
                    The page you're looking for may have been moved,
                    removed, or the link might be incorrect.
                    Let's get you back to TaskLocal.
                </p>

            </div>

            <div class="error-actions">

                <a href="index.html" class="primary-btn">

                    <i data-lucide="home"></i>

                    Back to Home

                </a>

                <button
                    type="button"
                    class="secondary-btn"
                    id="goBackBtn"
                >

                    <i data-lucide="arrow-left"></i>

                    Go Back

                </button>

            </div>

            <div class="error-help">

                <div class="help-icon">
                    <i data-lucide="search"></i>
                </div>

                <div>

                    <strong>
                        Looking for something?
                    </strong>

                    <span>
                        Try visiting the home page or browse our local services.
                    </span>

                </div>

            </div>

        </section>

    </main>

    <script>

        const body = document.body;
        const themeToggle = document.getElementById("themeToggle");
        const rtlToggle = document.getElementById("rtlToggle");
        const goBackBtn = document.getElementById("goBackBtn");

        const savedTheme =
            localStorage.getItem("tasklocal-theme");

        const savedDirection =
            localStorage.getItem("tasklocal-direction");

        if (savedTheme === "dark") {
            body.classList.add("dark");
        }

        if (savedDirection === "rtl") {
            document.documentElement.setAttribute("dir", "rtl");
            rtlToggle.textContent = "LTR";
        }

        function updateThemeIcon() {

            themeToggle.innerHTML =
                body.classList.contains("dark")
                    ? '<i data-lucide="sun"></i>'
                    : '<i data-lucide="moon"></i>';

            lucide.createIcons();
        }

        themeToggle.addEventListener("click", function () {

            body.classList.toggle("dark");

            localStorage.setItem(
                "tasklocal-theme",
                body.classList.contains("dark")
                    ? "dark"
                    : "light"
            );

            updateThemeIcon();

        });

        rtlToggle.addEventListener("click", function () {

            const currentDirection =
                document.documentElement.getAttribute("dir");

            if (currentDirection === "rtl") {

                document.documentElement.setAttribute("dir", "ltr");

                rtlToggle.textContent = "RTL";

                localStorage.setItem(
                    "tasklocal-direction",
                    "ltr"
                );

            } else {

                document.documentElement.setAttribute("dir", "rtl");

                rtlToggle.textContent = "LTR";

                localStorage.setItem(
                    "tasklocal-direction",
                    "rtl"
                );

            }

        });

        goBackBtn.addEventListener("click", function () {

            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = "index.html";
            }

        });

        lucide.createIcons();
        updateThemeIcon();

    </script>

</body>
</html>
