        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"

                            src="logo.jpeg"
                            alt="TaskLocal Logo"
                        >

                        <span class="logo-text">
                            Task<span class="logo-header-secondary">Local</span>
                        </span>

                    </a>

                </div>

                <button
                    class="sidebar-close"
                    id="sidebarClose"
                    type="button"
                    aria-label="Close navigation">

                    <i data-lucide="x"></i>

                </button>

            </div>


            <nav class="sidebar-menu">

                <div class="sidebar-section-title">
                    MAIN
                </div>

                <button
                    class="sidebar-link active"
                    data-section="dashboard"
                    type="button">

                    <i data-lucide="layout-dashboard"></i>

                    <span>Dashboard</span>

                </button>


                <button
                    class="sidebar-link"
                    data-section="tasks"
                    type="button">

                    <i data-lucide="clipboard-list"></i>

                    <span>My Tasks</span>

                    <span class="sidebar-count">
                        3
                    </span>

                </button>


                <button
                    class="sidebar-link"
                    data-section="browse"
                    type="button">

                    <i data-lucide="users"></i>

                    <span>Browse Pros</span>

                </button>


                <button
                    class="sidebar-link"
                    data-section="bids"
                    type="button">

                    <i data-lucide="gavel"></i>

                    <span>My Bids</span>

                    <span class="sidebar-count">
                        5
                    </span>

                </button>


                <button
                    class="sidebar-link"
                    data-section="messages"
                    type="button">

                    <i data-lucide="message-square"></i>

                    <span>Messages</span>

                    <span class="sidebar-count">
                        3
                    </span>

                </button>


                <div class="sidebar-section-title">
                    ACTIVITY
                </div>

                    class="sidebar-link"

                    class="sidebar-link"

                    ACCOUNT
                </div>


                <button
                    class="sidebar-link"
                    data-section="profile"
                    type="button">

                    <i data-lucide="user-round"></i>

                    <span>Profile</span>

                </button>


                <button
                    class="sidebar-link"
                    data-section="settings"

                    class="topbar-btn icon-top-btn"
                    id="themeToggle"

function renderSection(section) {

    const data = dashboardData[section];

    if (!data) {
        return;
    }

    pageEyebrow.textContent = data.eyebrow;

    pageTitle.textContent = data.title;

    content.innerHTML = data.html;

    document.querySelectorAll(".sidebar-link").forEach(link => {

        link.classList.toggle(
            "active",
            link.dataset.section === section
        );

    });

    lucide.createIcons();

    closeMobileSidebar();

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


document.querySelectorAll(".sidebar-link").forEach(link => {

    link.addEventListener("click", () => {

        renderSection(
            link.dataset.section
        );

    });

});


function openMobileSidebar() {

    sidebar.classList.add("open");

    mobileOverlay.classList.add("show");

    document.body.style.overflow = "hidden";

}


function closeMobileSidebar() {

    sidebar.classList.remove("open");

    mobileOverlay.classList.remove("show");

    document.body.style.overflow = "";

}


mobileMenuBtn.addEventListener(
    "click",
    openMobileSidebar
);


sidebarClose.addEventListener(
    "click",
    closeMobileSidebar
);


mobileOverlay.addEventListener(
    "click",
    closeMobileSidebar
);


document.addEventListener(
    "keydown",
    event => {

        if (event.key === "Escape") {

            closeMobileSidebar();

            profileDropdown.classList.remove("open");

            profileButton.setAttribute(
                "aria-expanded",
                "false"
            );

        }

    }
);


profileButton.addEventListener(
    "click",
    event => {

        event.stopPropagation();

        const open =
            profileDropdown.classList.toggle("open");

        profileButton.setAttribute(
            "aria-expanded",
            open ? "true" : "false"
        );

    }
);


profileDropdown.addEventListener(
    "click",
    event => {

        event.stopPropagation();

    }
);


document.addEventListener(
    "click",
    () => {

        profileDropdown.classList.remove("open");

        profileButton.setAttribute(
            "aria-expanded",
            "false"
        );

    }
);


document.querySelectorAll(
    "[data-profile-action]"
).forEach(button => {

    button.addEventListener(
        "click",
        () => {

            const action =
                button.dataset.profileAction;

            profileDropdown.classList.remove("open");

            if (action === "profile") {

                renderSection("profile");

            }

            if (action === "notifications") {

                renderSection("notifications");

            }

        }
    );

});


notificationTopBtn.addEventListener(
    "click",
    () => {

        renderSection("notifications");

    }
);


function logout() {

    const confirmed =
        window.confirm(
            "Are you sure you want to logout?"
        );

    if (!confirmed) {
        return;
    }

    showToast(
        "Logging out..."
    );

    setTimeout(() => {

        window.location.href =
            "login.html";

    }, 800);

}


sidebarLogout.addEventListener(
    "click",
    logout
);


profileLogout.addEventListener(
    "click",
    logout
);


themeToggle.addEventListener(
    "click",
    () => {

        document.body.classList.toggle("dark");

        const isDark =
            document.body.classList.contains("dark");

        localStorage.setItem(
            "tasklocal-theme",
            isDark ? "dark" : "light"
        );

        themeToggle.innerHTML = isDark
            ? '<i data-lucide="sun"></i>'
            : '<i data-lucide="moon"></i>';

        lucide.createIcons();

    }
);


rtlToggle.addEventListener(
    "click",
    () => {

        const html =
            document.documentElement;

        const current =
            html.getAttribute("dir");

        const next =
            current === "rtl"
                ? "ltr"
                : "rtl";

        html.setAttribute(
            "dir",
            next
        );

        localStorage.setItem(
            "tasklocal-direction",
            next
        );

    }
);


function showToast(message) {

    toastMessage.textContent =
        message;

    toast.classList.add("show");

    setTimeout(() => {

        toast.classList.remove("show");

    }, 2200);

}


const savedTheme =
    localStorage.getItem(
        "tasklocal-theme"
    );

if (savedTheme === "dark") {

    document.body.classList.add("dark");

    themeToggle.innerHTML =
        '<i data-lucide="sun"></i>';

}


const savedDirection =
    localStorage.getItem(
        "tasklocal-direction"
    );

if (savedDirection) {

    document.documentElement.setAttribute(
        "dir",
        savedDirection
    );

}


lucide.createIcons();

renderSection("dashboard");
    </script>
